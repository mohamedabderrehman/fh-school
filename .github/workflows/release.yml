name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, pdo_sqlite, sqlite3, curl, fileinfo, mbstring, redis
      - run: python tools/check-syntax.py
      - run: |
          php -S 127.0.0.1:8083 router.php > /tmp/school.log 2>&1 &
          sleep 2
          python tools/check-demo.py

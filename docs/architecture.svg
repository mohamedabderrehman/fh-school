<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">FH-School architecture</title><desc id="desc">Student signs into an academic-year record → teacher opens a permitted subject/class → grades or attendance are saved → administrator publishes announcements and manages accounts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2847e7"/></marker></defs><rect width="1200" height="460" rx="16" fill="#f5f4ef"/><text x="40" y="54" font-family="sans-serif" font-size="26" fill="#171b26">FH-School · component relationships</text><path d="M290 240H323" stroke="#2847e7" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="60" y="160" font-family="monospace" font-size="15" fill="#2847e7">01</text><text x="60" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Student portal</text><text x="60" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Teacher dashboard</text><text x="60" y="289" font-family="sans-serif" font-size="17" fill="#171b26">Admin tools</text><path d="M580 240H613" stroke="#2847e7" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="350" y="160" font-family="monospace" font-size="15" fill="#2847e7">02</text><text x="350" y="205" font-family="sans-serif" font-size="17" fill="#171b26">PHP sessions</text><text x="350" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Role / CSRF checks</text><path d="M870 240H903" stroke="#2847e7" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="640" y="160" font-family="monospace" font-size="15" fill="#2847e7">03</text><text x="640" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Distributed SQLite</text><text x="640" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Synthetic fixtures</text><rect x="910" y="120" width="250" height="235" rx="12" fill="white" stroke="#d6d7d3"/><text x="930" y="160" font-family="monospace" font-size="15" fill="#2847e7">04</text><text x="930" y="205" font-family="sans-serif" font-size="17" fill="#171b26">Grades / attendance</text><text x="930" y="247" font-family="sans-serif" font-size="17" fill="#171b26">Announcements</text><text x="40" y="418" font-family="sans-serif" font-size="15" fill="#555a68">Source-based overview. Arrows describe workflow relationships, not deployment topology.</text></svg>